<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audelia — Read. Learn. Grow.</title>
<style>
:root{--bg:#f7f6f0;--panel:#fffefa;--ink:#20352a;--muted:#758078;--green:#245b46;--soft:#e4eee5;--line:#e2e6dd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 13px}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{padding:25px 16px;background:#fbfaf6;border-right:1px solid var(--line)}.brand{font:26px Georgia,serif;margin:5px 8px 28px}.brand small{display:block;font:10px system-ui;letter-spacing:2px;color:var(--muted)}nav{display:grid;gap:6px}nav button{text-align:left;background:transparent;color:var(--muted)}nav button.active,nav button:hover{background:var(--soft);color:var(--green)}.side p{margin-top:45px;padding:15px;background:var(--soft);border-radius:14px;color:#526c5a;font-size:13px}.main{padding:28px clamp(16px,4vw,48px);max-width:1400px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted)}h1{font:36px Georgia,serif;margin:5px 0}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px}.primary{background:var(--green);color:white}.secondary{background:var(--panel);border:1px solid var(--line);color:var(--ink)}.searchrow{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:23px}.search{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:0 13px;flex:1;min-width:220px}.search input{padding:13px 0;border:0;outline:0;background:transparent;color:var(--ink);width:100%}select,input[type=text],input[type=email],input[type=password]{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:11px}.hero{background:linear-gradient(120deg,#e3eee1,#f0f0e6);border-radius:22px;padding:30px;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.hero h2{font:36px/1.12 Georgia,serif;margin:8px 0;max-width:430px}.hero p{color:#647267;max-width:420px}.covers{display:flex;gap:10px;padding:10px}.cover{width:85px;height:125px;border-radius:5px 10px 10px 5px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:5px 7px 15px #233a251a;border-left:4px solid #ffffff50;font:18px Georgia,serif}.cover:nth-child(2){transform:translateY(-12px) rotate(5deg)}.cover:nth-child(3){transform:rotate(7deg)}.section{display:flex;justify-content:space-between;align-items:center;margin:24px 0 13px}.section h2{font:25px Georgia,serif;margin:0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}.card .cover{width:100%;height:auto;aspect-ratio:.75;box-shadow:none;margin-bottom:12px}.card h3{font-size:15px;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progress{height:5px;background:#e6e9e2;border-radius:9px;margin:12px 0 6px;overflow:hidden}.progress span{display:block;height:100%;background:#5c9473}.rowbtn{display:flex;gap:6px;margin-top:10px}.rowbtn button{flex:1;padding:8px 5px;font-size:12px;background:var(--soft);color:var(--green)}.rowbtn .save{background:transparent;border:1px solid var(--line);color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat,.panel{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:15px}.stat strong{display:block;font:28px Georgia,serif}.reader{max-width:760px;margin:auto;padding:clamp(20px,5vw,45px);background:var(--panel);border:1px solid var(--line);border-radius:20px}.reader h2{font:34px Georgia,serif}.copy{font:19px/1.9 Georgia,serif;white-space:pre-line;margin:28px 0}.empty{text-align:center;padding:45px;background:var(--panel);border:1px dashed var(--line);border-radius:15px;color:var(--muted)}.toast{position:fixed;bottom:18px;right:18px;background:#1e4b37;color:white;padding:13px 18px;border-radius:11px}.hidden{display:none!important}.dark{--bg:#111b17;--panel:#1b2822;--ink:#e6eee8;--muted:#a3b0a6;--green:#8bb99a;--soft:#263c30;--line:#34443a}.dark .side{background:#15201a}.dark .hero{background:linear-gradient(120deg,#243a2d,#28332c)}.dark .hero p{color:#c0d0c3}.dark .side p{color:#c0d0c3}.mobile{display:none}

.setting-row{display:flex;align-items:center;gap:14px;width:100%;padding:16px 20px;background:transparent;border:0;border-top:1px solid var(--line);text-align:left;color:var(--text);cursor:pointer}
.setting-row:hover{background:var(--soft)}
.setting-icon{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border-radius:12px;background:var(--soft);font-size:20px;color:var(--green)}
.setting-copy{display:flex;flex-direction:column;gap:4px;flex:1}
.setting-copy strong{font-size:15px;font-weight:650}
.setting-copy small{font-size:12px;color:var(--muted)}
.setting-trailing{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.chevron{font-size:24px;color:var(--muted);line-height:1}

@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.app{grid-template-columns:185px 1fr}.hero h2{font-size:30px}}
@media(max-width:650px){.app{display:block;padding-bottom:65px}.side{display:none}.main{padding:20px 14px}.head h1{font-size:29px}.hero{display:block;padding:23px}.covers{padding:18px 0 0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);justify-content:space-around;padding:7px;z-index:3}.mobile button{font-size:11px;text-align:center;padding:7px}.mobile b{display:block;font-size:18px}.stats{gap:7px}.stat{padding:12px}.stat strong{font-size:23px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Audelia<small>READ · LEARN · GROW</small></div><nav id="nav"></nav><p><b>Make space to read.</b><br>A few quiet pages can make a brighter day.</p></aside><main class="main"><header class="head"><div><div class="eyebrow">YOUR READING SPACE</div><h1 id="title">Good morning, reader.</h1><div class="muted" id="sub">Your next favourite book is waiting.</div></div></header><div id="view"></div></main></div><nav class="mobile" id="mobile"></nav><div id="toast" class="toast hidden"></div>
<script>
let showGoals = false;
const books=[
{id:'atomic',title:'Atomic Habits',author:'James Clear',genre:'Self-improvement',lang:'English',format:'EPUB',color:'#d7e5d2',symbol:'✳',pages:320,p:42,sample:'Every action you take is a vote for the type of person you wish to become. Small habits may seem insignificant on any given day, yet over time they compound into remarkable results.\n\nYou do not rise to the level of your goals. You fall to the level of your systems. Focus on building a system that makes the next good action easier.'},
{id:'gatsby',title:'The Great Gatsby',author:'F. Scott Fitzgerald',genre:'Classic',lang:'English',format:'EPUB',color:'#e9d8b8',symbol:'✦',pages:180,p:73,sample:'In my younger and more vulnerable years my father gave me some advice that I have been turning over in my mind ever since.\n\nWhenever you feel like criticizing anyone, remember that people may not have had the same advantages as you.'},
{id:'1984',title:'1984',author:'George Orwell',genre:'Fiction',lang:'English',format:'PDF',color:'#f0d7d5',symbol:'1984',pages:328,p:15,sample:'It was a bright cold day in April, and the clocks were striking thirteen. The city seemed to hold its breath beneath the pale sky.'},
{id:'pride',title:'Pride and Prejudice',author:'Jane Austen',genre:'Romance',lang:'English',format:'EPUB',color:'#e6dced',symbol:'P&P',pages:432,p:0,sample:'It is a truth universally acknowledged, that a single person in possession of a good fortune, must be in want of a partner.'},
{id:'alchemist',title:'The Alchemist',author:'Paulo Coelho',genre:'Fiction',lang:'English',format:'PDF',color:'#f0d9ad',symbol:'☼',pages:208,p:100,sample:'When you want something, all the universe conspires in helping you to achieve it.'},
{id:'money',title:'The Psychology of Money',author:'Morgan Housel',genre:'Finance',lang:'English',format:'EPUB',color:'#d3e5d9',symbol:'$',pages:256,p:0,sample:'Doing well with money has little to do with how smart you are and a lot to do with how you behave.'},
{id:'sapiens',title:'Sapiens',author:'Yuval Noah Harari',genre:'History',lang:'English',format:'PDF',color:'#d9dced',symbol:'S',pages:443,p:0,sample:'The ability to believe in shared stories has helped humans cooperate in remarkably flexible ways.'},
{id:'hindi',title:'Godaan',author:'Munshi Premchand',genre:'Classic',lang:'Hindi',format:'EPUB',color:'#ead8c6',symbol:'गोदान',pages:350,p:0,sample:'साहित्य जीवन को समझने और उसके अनुभवों को महसूस करने का एक सुंदर माध्यम है।'}
];
let page='Home',query='',genre='All genres',format='All formats',lang='All languages',dark=false,selected=books[0].id,saved=['atomic','gatsby'],progress=Object.fromEntries(books.map(b=>[b.id,b.p])),goal=20,minutes=5,notes={},uploaded=[];
const pages=['Home','My Library','Browse','Settings','Add a Book'];
const icons={Home:'⌂','My Library':'▤',Browse:'⌕',Settings:'⚙','Add a Book':'＋',Reader:'▣',Profile:'♙'};
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2300)}
function allBooks(){return [...books,...uploaded]}
function nav(){let html=pages.map(p=>`<button class="${page===p?'active':''}" data-page="${p}">${icons[p]} &nbsp; ${p}</button>`).join('');document.getElementById('nav').innerHTML=html;document.getElementById('mobile').innerHTML=pages.slice(0,4).map(p=>`<button class="${page===p?'active':''}" data-page="${p}"><b>${icons[p]}</b>${p==='Settings'?'Settings':p==='My Library'?'Library':p}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(p){page=p;render()}
function cover(b){return b.poster?`<div class="cover" style="background:${b.color};padding:0;overflow:hidden"><img src="${b.poster}" alt="${esc(b.title)} book poster" style="width:100%;height:100%;object-fit:cover;border-radius:inherit"></div>`:`<div class="cover" style="background:${b.color};color:#294b39"><span>${b.symbol}</span><span>${b.title}</span></div>`}
function card(b){let pct=progress[b.id]||0;return `<article class="card">${cover(b)}<h3 title="${b.title}">${b.title}</h3><div class="muted">${b.author}</div><div class="progress"><span style="width:${pct}%"></span></div><div class="muted">${pct}% read · ${b.format}</div><div class="rowbtn"><button data-read="${b.id}">Read</button><button class="save" data-save="${b.id}">${saved.includes(b.id)?'♥ Saved':'＋ Save'}</button></div></article>`}
function matching(){let q=query.trim().toLowerCase();return allBooks().filter(b=>(!q||[b.title,b.author,b.genre,b.lang,b.format].some(x=>x.toLowerCase().includes(q))||b.title.toLowerCase().split(' ').some(w=>q.length>2&&w.startsWith(q)))&&(genre==='All genres'||b.genre===genre)&&(format==='All formats'||b.format===format)&&(lang==='All languages'||b.lang===lang)&&(page!=='My Library'||saved.includes(b.id)))}
function searchControls(){return `<div class="searchrow"><div class="search">⌕ <input id="q" placeholder="Smart search: title, author, genre…" value="${esc(query)}"></div><select id="genre"><option>All genres</option>${[...new Set(allBooks().map(b=>b.genre))].map(g=>`<option ${g===genre?'selected':''}>${g}</option>`).join('')}</select><select id="format"><option>All formats</option><option ${format==='PDF'?'selected':''}>PDF</option><option ${format==='EPUB'?'selected':''}>EPUB</option></select><select id="lang"><option>All languages</option><option ${lang==='English'?'selected':''}>English</option><option ${lang==='Hindi'?'selected':''}>Hindi</option></select></div>`}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function bindSearch(){document.getElementById('q').oninput=e=>{query=e.target.value;let pos=e.target.selectionStart;render(false);let n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)};['genre','format','lang'].forEach(id=>document.getElementById(id).onchange=e=>{if(id==='genre')genre=e.target.value;if(id==='format')format=e.target.value;if(id==='lang')lang=e.target.value;render()})}
function bindCards(){document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{selected=b.dataset.read;go('Reader')});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let id=b.dataset.save;saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];toast(saved.includes(id)?'Added to your library':'Removed from your library');render()})}
function render(updateNav=true){if(updateNav)nav();document.body.classList.toggle('dark',dark);let titles={Home:['Good morning, reader.','Your next favourite book is waiting.'],Browse:['Find your next read.','Search across titles, authors, genres and formats.'],'My Library':['Your personal library.','All your saved books, together.'],'Settings':['Make Audelia feel like yours.','Manage your appearance, profile and reading goals.'],'Add a Book':['Bring your bookshelf with you.','Add a title or import a local PDF/EPUB file.'],Reader:['A quiet moment with a book.','Pick up right where you left off.'],Profile:['Your reading profile.','Your personal reading space.']};document.getElementById('title').textContent=titles[page][0];document.getElementById('sub').textContent=titles[page][1];let v=document.getElementById('view');
if(['Home','Browse','My Library'].includes(page)){let list=matching();v.innerHTML=(page==='Home'?`<section class="hero"><div><div class="eyebrow">YOUR NEXT CHAPTER STARTS HERE</div><h2>Make time for the stories that stay with you.</h2><p>A calm, personal space for all the books you love. No distractions — just reading.</p><button class="primary" id="explore">Explore the library →</button></div><div class="covers">${cover(books[0])}${cover(books[1])}${cover(books[2])}</div></section><div class="stats"><div class="stat"><strong>${saved.length}</strong><span>Saved books</span></div><div class="stat"><strong>${allBooks().filter(b=>(progress[b.id]||0)===100).length}</strong><span>Books completed</span></div><div class="stat"><strong>${minutes}/${goal} min</strong><span>Today's reading</span></div></div>`:'')+searchControls()+`<div class="section"><h2>${page==='My Library'?'Saved books':page==='Browse'?'Browse collection':'Picked for you'}</h2><span class="muted">${list.length} books</span></div><div class="grid">${list.map(card).join('')}</div>${list.length?'':'<div class="empty">No matching books. Try a different search or filter.</div>'}`;document.getElementById('explore')?.addEventListener('click',()=>go('Browse'));bindSearch();bindCards()}
else if(page==='Reader'){let b=allBooks().find(x=>x.id===selected)||books[0],pct=progress[b.id]||0;v.innerHTML=`<div class="reader"><button class="secondary" id="back">← Library</button><div style="display:flex;justify-content:center;margin:24px">${cover(b)}</div><div class="eyebrow" style="text-align:center">${b.genre} · ${b.lang}</div><h2 style="text-align:center">${b.title}</h2><p class="muted" style="text-align:center">${b.author}</p><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><div class="copy" id="copy">${b.sample}</div><div class="section"><span class="muted">Reading progress</span><b>${pct}%</b></div><input id="pct" type="range" min="0" max="100" value="${pct}" style="width:100%;accent-color:var(--green)"><div class="actions" style="margin-top:18px"><button class="primary" id="next">Next pages →</button><button class="secondary" id="mark">${saved.includes(b.id)?'♥ Saved':'＋ Save book'}</button><button class="secondary" id="font">A−</button><button class="secondary" id="fontup">A+</button></div><p class="muted" style="margin-top:20px">Reading preview uses sample text. Import your own PDF/EPUB in the full app to read complete files.</p></div>`;document.getElementById('back').onclick=()=>go('My Library');document.getElementById('pct').oninput=e=>{progress[b.id]=+e.target.value;render(false)};document.getElementById('next').onclick=()=>{progress[b.id]=Math.min(100,(progress[b.id]||0)+10);toast('Reading progress saved in this demo');render(false)};document.getElementById('mark').onclick=()=>{saved=saved.includes(b.id)?saved.filter(x=>x!==b.id):[...saved,b.id];render(false)};document.getElementById('font').onclick=()=>{let c=document.getElementById('copy');c.style.fontSize=(parseFloat(getComputedStyle(c).fontSize)-1)+'px'};document.getElementById('fontup').onclick=()=>{let c=document.getElementById('copy');c.style.fontSize=(parseFloat(getComputedStyle(c).fontSize)+1)+'px'}}
else if(page==='Settings'){v.innerHTML=`<section class="panel" style="padding:0;overflow:hidden"><div class="eyebrow" style="padding:20px 20px 8px">PREFERENCES</div><button class="setting-row" id="themeToggle"><span class="setting-icon">◐</span><span class="setting-copy"><strong>Theme</strong><small>${dark?'Dark mode is on':'Light mode is on'}</small></span><span class="setting-trailing">${dark?'Dark':'Light'} <span class="chevron">›</span></span></button><button class="setting-row" id="openProfile"><span class="setting-icon">♙</span><span class="setting-copy"><strong>Profile</strong><small>Manage your reader profile</small></span><span class="chevron">›</span></button><button class="setting-row" id="openUpload"><span class="setting-icon">⇧</span><span class="setting-copy"><strong>Upload Book</strong><small>Import a PDF or EPUB from your device</small></span><span class="chevron">›</span></button><div class="eyebrow" style="padding:20px 20px 8px">READING</div><button class="setting-row" id="toggleGoals"><span class="setting-icon">◎</span><span class="setting-copy"><strong>Reading Goals</strong><small>Daily target and reading time</small></span><span class="chevron" id="goalChevron">${showGoals?'⌄':'›'}</span></button><div id="goalDetails" style="display:${showGoals?'block':'none'};padding:4px 20px 22px"><h2 style="font:28px Georgia,serif;margin:8px 0">${minutes} / ${goal} minutes</h2><input id="goal" type="range" min="5" max="120" step="5" value="${goal}" style="width:100%;accent-color:var(--green)"><p class="muted">Set a daily reading target that feels achievable.</p><button class="primary" id="addmin">＋ Add 5 reading minutes</button> <button class="secondary" id="reset">Reset today</button><div class="stats" style="margin-top:16px"><div class="stat"><strong>${saved.length}</strong><span>Saved books</span></div><div class="stat"><strong>${allBooks().filter(b=>(progress[b.id]||0)===100).length}</strong><span>Completed books</span></div><div class="stat"><strong>${Math.round(allBooks().reduce((s,b)=>s+(progress[b.id]||0),0)/allBooks().length)}%</strong><span>Average progress</span></div></div></div></section>`;document.getElementById('themeToggle').onclick=()=>{dark=!dark;render(false)};document.getElementById('openProfile').onclick=()=>go('Profile');document.getElementById('openUpload').onclick=()=>go('Add a Book');document.getElementById('toggleGoals').onclick=()=>{showGoals=!showGoals;render(false)};document.getElementById('goal').oninput=e=>{goal=+e.target.value;render(false)};document.getElementById('addmin').onclick=()=>{minutes=Math.min(goal,minutes+5);render(false);toast('Reading time updated')};document.getElementById('reset').onclick=()=>{minutes=0;render(false)}}
else if(page==='Add a Book'){v.innerHTML=`<div class="panel" style="max-width:650px;margin:auto"><h2 style="font:28px Georgia,serif">Add to your library</h2><p class="muted">Add your book details, choose a poster image, and select a PDF/EPUB file.</p><label>Book title<br><input id="newtitle" type="text" placeholder="e.g. My favourite book" style="width:100%;margin-top:7px"></label><label style="display:block;margin:16px 0">Author (optional)<br><input id="newauthor" type="text" placeholder="Author name" style="width:100%;margin-top:7px"></label><div class="upload-zone" style="margin:16px 0"><div style="font-size:30px">▧</div><b>Book poster / cover image</b><p class="muted">Upload a JPG, PNG or WEBP image to use as the book cover in your library.</p><input type="file" id="poster" accept="image/png,image/jpeg,image/webp"><div id="posterPreview" style="margin-top:12px"></div></div><button class="primary" id="addtitle">Add book to library</button><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><div class="upload-zone"><div style="font-size:30px">⇧</div><b>Choose a PDF or EPUB</b><p class="muted">Select the actual book file. The poster image is separate from the PDF/EPUB.</p><input type="file" id="file" accept=".pdf,.epub,application/pdf,application/epub+zip"></div><div id="filemsg" class="muted" style="margin-top:10px"></div></div>`;let posterData='';document.getElementById('poster').onchange=e=>{let f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('Please choose an image file');let reader=new FileReader();reader.onload=ev=>{posterData=ev.target.result;document.getElementById('posterPreview').innerHTML=`<img src="${'${posterData}'}" alt="Book poster preview" style="width:110px;height:155px;object-fit:cover;border-radius:8px;border:1px solid var(--line)"><div class="muted" style="margin-top:6px">${'${esc(f.name)}'}</div>`};reader.readAsDataURL(f)};document.getElementById('addtitle').onclick=()=>{let t=document.getElementById('newtitle').value.trim();if(!t)return toast('Please enter a book title');uploaded.push({id:'u'+Date.now(),title:t,author:document.getElementById('newauthor').value.trim()||'Unknown author',genre:'Personal',lang:'English',format:'EPUB',color:'#d9e7db',symbol:'BOOK',poster:posterData,pages:100,p:0,sample:'Your book title has been added to this demo library. The complete PDF/EPUB reader will be connected in the full app.'});saved.push(uploaded[uploaded.length-1].id);toast('Book added to demo library');go('My Library')};document.getElementById('file').onchange=e=>{let f=e.target.files[0];if(f)document.getElementById('filemsg').textContent='Selected: '+f.name+' ('+Math.ceil(f.size/1024)+' KB). File selection works; full document rendering is a next development step.'}}
else if(page==='Profile'){v.innerHTML=`<div class="panel" style="max-width:540px;margin:auto;text-align:center"><div style="font-size:48px">♙</div><h2 style="font:30px Georgia,serif">Guest reader</h2><p class="muted">Create an account in the full version to sync your library across devices.</p><button class="primary" id="login">Preview signup / login</button><p class="muted">No real account is created by this prototype.</p></div>`;document.getElementById('login').onclick=()=>{v.innerHTML=`<div class="panel" style="max-width:480px;margin:auto"><h2 style="font:30px Georgia,serif">Welcome to Audelia</h2><label>Email</label><input type="email" placeholder="you@example.com" style="width:100%;margin:5px 0 12px"><label>Password</label><input type="password" placeholder="At least 8 characters" style="width:100%;margin:5px 0 15px"><button class="primary" id="fake">Continue demo</button><p class="muted">Demo only — authentication needs a secure backend.</p></div>`;document.getElementById('fake').onclick=()=>toast('Real signup/login is not connected yet')}}
}
render();
</script></body></html>
